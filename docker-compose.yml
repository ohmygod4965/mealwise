# 一键启动：MySQL 8 + 应用（多阶段构建，宿主机不需要 JDK/Maven）
# 用法：
#   1. cp .env.example .env   # 填 DEEPSEEK_API_KEY（不填则 AI 能力自动降级）
#   2. docker compose up --build
#   3. 打开 http://localhost:8080

services:
  mysql:
    image: mysql:8.0
    container_name: mealwise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: mealwise
      MYSQL_USER: mealwise
      MYSQL_PASSWORD: mealwise
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"          # 避免与本机已有 MySQL(3306) 冲突
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealwise-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mealwise
      DB_USER: mealwise
      DB_PASSWORD: mealwise
      # 生产必须换成随机长串（>=32 字节）
      JWT_SECRET: ${JWT_SECRET:-mealwise-docker-demo-secret-key-please-change-0123456789}
      # AI：不填 key 时自动降级为本地规则/检索，不会 500
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  mysql-data:
