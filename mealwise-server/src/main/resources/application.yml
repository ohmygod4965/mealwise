server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: mealwise

spring:
  application:
    name: mealwise
  profiles:
    active: dev
  # 迁移：全新库执行 V1（建表+种子）；已有库自动 baseline 到 V1，不重复建表
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  # AI 密钥放 ai-local.yml（已 gitignore），生产用环境变量 DEEPSEEK_API_KEY 覆盖
  config:
    import:
      - optional:file:./ai-local.yml
      - optional:file:../ai-local.yml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 鉴权参数：secret 至少 32 字节（HS256），生产环境用环境变量覆盖
jwt:
  secret: "mealwise-dev-secret-key-please-change-in-production-0123456789"
  expire-seconds: 86400
  header: Authorization
  prefix: "Bearer "

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] [u:%X{userId:-anon}] %logger{40} - %msg%n"
  level:
    com.mealwise: debug
# AI 饮食推荐：无密钥时自动降级为本地规则搭配（source=local）
ai:
  enabled: true
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  timeout-ms: ${AI_TIMEOUT_MS:60000}
  web-timeout-ms: 15000
